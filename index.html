<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phiếu Thống Kê Phát Biểu Lễ Hội Lời</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Chiều cao tự dãn khít theo màn hình điện thoại thực tế */
      overflow: hidden; /* Ngăn chặn cuộn trang kép */
      background-color: #f8f9fa;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Thay đường link /exec của bạn vào thuộc tính src dưới đây -->

</html>
